<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Epoch Counter</title>
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<style>
    html,body{
        margin:0;padding:0;
        height:100%;width:100%;
        top:0;bottom:0;
        left:0;right:0;
        overflow:hidden;
        background:#000;
        color:#fff;
        font-family:sans-serif;
        -webkit-tap-highlight-color:transparent;
    }
    body{
        display:flex;
        flex-direction:column;
        z-index:0;
        touch-action:none !important;
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
    }
    #title{
        top:0; left:0; right:0;
        position:relative;
        background:#111;
        padding:2vh 2vw;
        box-sizing:border-box;
        font-size:2.2vmin;
        opacity:0.9;
        text-align:center;
    }
    /* -------------- loading progress bar -------------- */
    .progress-bar {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 0;
        width: 50vmin;
        margin-left: calc((100% - 50vmin)/2);
        font-size: 2.2vmin;
        bottom: calc(-0.5lh - (2vh - 2.5vmin) / 2 + 2vh + 3.5vmin);
        overflow: visible;
        z-index: 996;
    }
    .progress-bar > label {
        position: relative;
        width: 100%;
        margin-left: 0;
        text-align: center;
        text-anchor: middle;
        color: #777;
        animation: slide-in 3s ease infinite alternate;
    }
    .progress-bar > progress#progressBar {
        position: relative;
        display: block;
        top: -1.05lh;
        left: 0;
        right: 0;
        min-height: 1.05lh;
        width: 100%;
        margin-left: 0;
        opacity: 50%;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        border-radius: 1.1lh;
        background: transparent;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
    }
    .progress-bar > progress#progressBar::-webkit-progress-bar {
        background-color: #333;
    }
    .progress-bar > progress#progressBar::-webkit-progress-value {
        background-color: #ddd;
    }
    .progress-bar > progress#progressBar {
        background-color: #333;
    }
    .progress-bar > progress#progressBar::-moz-progress-bar {
        background-color: #ddd;
    }
    .progress-bar > #progressBar[value="0"], 
    .progress-bar > #progressBar[value="100"], 
    .progress-bar > label:has(+ #progressBar[value="0"]), 
    .progress-bar > label:has(+ #progressBar[value="100"]) {
        display:none;
    }

    /* -------------------------------------------------
       1️⃣ Shared panel styling
       ------------------------------------------------- */
    .vpanel{
        position:relative;
        left:0;right:0;
        display:flex;
        z-index:999;
    }
    .vpanel.top{flex-direction:column;}
    .vpanel.bottom{flex-direction:column-reverse;}
    .slide-panel{
        position:relative;
        left:0;right:0;
        background:#111;
        box-shadow:0 4px 12px rgba(0,0,0,.15);
        transition:margin,height 0.42s cubic-bezier(.25,.8,.25,1);
        display:none;
    }
    .slide-panel.opening{display:block;}
    .vpanel.open > .slide-panel{display:block;}
    .vpanel.top > .slide-panel{top:0;}
    .vpanel.bottom > .slide-panel{bottom:0;}

    /* -------------------------------------------------
       2️⃣ Visual “edge” indicator (thin gradient bar)
       ------------------------------------------------- */
    .drag-indicator{
        position:relative;
        left:0;right:0;
        height:2.2vmin;
        z-index:998;
        cursor:ns-resize;
    }
    .vpanel.top > .drag-indicator{
        top:0;
        background:linear-gradient(to bottom, #111, #000);
    }
    .vpanel.bottom > .drag-indicator{
        bottom:0;
        background:linear-gradient(to top, #111, #000);
    }
    /* -------------------------------------------------
       6️⃣ Accessibility helpers
       ------------------------------------------------- */
    .drag-indicator:focus{
        outline:.3vmin dotted #666;
    }
    /* -------------------------------------------------
       3️⃣ Full‑screen invisible drag zones (when panels are hidden)
       ------------------------------------------------- */
    /* -------------------------------------------------
       4️⃣ MAIN DISPLAY AREA – centered between panels
       ------------------------------------------------- */
    .main-display{
        flex-grow:1;
        /* Flex centering inside that space */
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-align:center;
        box-sizing:border-box;
        z-index:1000;
    }
    /* -------------------------------------------------
       Main clock – horizontal, as large as possible
       ------------------------------------------------- */
    #clock{
        display:flex;
        flex-direction:row;
        justify-content:center;
        align-items:center;
        width:100%;
        height:100%;
        gap:2vmin;
        position:relative;
    }
    .unit{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        flex:1;
        min-width:0;
        position:relative;
    }
    .digits{
        /* clamp(min,preferred,max) – keeps the numbers huge but forces them to shrink
           enough to stay on one line on any device. */
        font-size: clamp(2rem, 8vw, 10vh);
        line-height:1;
        user-select:none;
        cursor:pointer;
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
    }
    .digit{
        display:inline-block;
        min-width:0.6em;
        pointer-events:auto;
    }
    .digit:focus-visible, .digit:active{
        outline:.3vmin dotted #666;
    }
    .label{
        font-size:calc(1vmax);
        opacity:0.6;
        margin-top:0.5vh;
    }
    /* -------------------------------------------------
       Single‑digit overlay (fullscreen)
       ------------------------------------------------- */
    #digitOverlay{
        position:fixed;
        inset:0;
        background:#000;
        display:none;
        justify-content:center;
        align-items:center;
        top:0;bottom:0;
        left:0;right:0;
        z-index:3000;
    }
    #digitOverlay span{
        font-size: clamp(10vw, 120vh, 180vw);
    }
    /* -------------------------------------------------
       Clock overlay (fullscreen)
       ------------------------------------------------- */
    #clockOverlay{
        position:fixed;
        inset:0;
        background:#000;
        display:none;
        flex-grow:1;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        box-sizing: border-box;
        top:0;bottom:0;
        left:0;right:0;
        z-index:2500;
    }
    #clockOverlay span{
        font-size: clamp(2rem, 12vw, 27vh);
    }
    #clockOverlay.active{
        display:flex;
    }
    #clockOverlay .flex-content{
        width:100vw;
        height:100vh;
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }
    /* -------------------------------------------------
       QR‑code overlay (opaque, click‑anywhere to close)
       ------------------------------------------------- */
    #qrOverlay{
        position:fixed;
        inset:0;
        background:#000;
        display:none;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        gap:2vmin;
        top:0;bottom:0;
        left:0;right:0;
        z-index:2000;
    }
    #qrContainer{
        background:#fff;
        padding:1vmin;
        border-radius:0.5vmin;
    }
    /* -------------------------------------------------
       Sync UI – larger sliders + title
       ------------------------------------------------- */
    #sync{
        position:relative;
        bottom:0; left:0; right:0;
        background:#111;
        padding:2vh 2vw;
        box-sizing:border-box;
        display:flex;
        flex-direction:column;
        gap:2vmin;
        box-sizing:border-box;
    }
    #syncTitle{
        font-size:2.2vmin;
        opacity:0.9;
        text-align:center;
    }
    .slider-group{
        display:flex;
        align-items:center;
        gap:1vw;
    }
    .slider-group label{
        min-width:14ch;
        font-size:2.2vmin;
    }
    .slider-group output{
        min-width:4.25ch;
        font-size:2.2vmin;
    }
    .step-btn{
        background:rgba(255,255,255,0.2);
        border:none;
        border-radius:0.5vmin;
        color:#fff;
        min-width:2ch;
        font-size:2.2vmin;
        align-items:center;
    }
    .step-btn:hover{
        background:#888;
    }
    .step-btn:active{
        background:#ccc;
    }
    .step-btn:focus-visible{
        outline:.3vmin dotted #666;
    }
    input[type=range]{
        flex:1;
        -webkit-appearance:none;
        height:1.1vh;
        background:rgba(255,255,255,0.2);
        border-radius:2vmin;
        outline:none;
    }
    input[type=range]::-webkit-slider-thumb{
        -webkit-appearance:none;
        width:2.2vmin;
        height:2.2vmin;
        background:#fff;
        border-radius:50%;
        cursor:pointer;
        border:0.3vmin solid #888;
    }
    input[type=range]::-moz-range-thumb{
        width:2.2vmin;
        height:2.2vmin;
        background:#fff;
        border-radius:50%;
        cursor:pointer;
        border:0.3vmin solid #888;
    }
    input[type=range]:hover::-webkit-range-thumb, input[type=range]:hover::-moz-range-thumb{
        background:#ddd;
        border:0.3vmin dotted #333;
    }
    input[type=range]:focus-visible::-webkit-range-thumb, input[type=range]:focus-visible::-moz-range-thumb{
        background:#ddd;
        border:0.3vmin dotted #333;
    }
    input[type=range]:active::-webkit-range-thumb, input[type=range]:active::-moz-range-thumb{
        background:#ccc;
        border:0.3vmin dotted #444;
    }
    /* -------------------------------------------------
       5️⃣ Floating action button (moves with bottom panel)
       ------------------------------------------------- */
    .fab-panel{
        display:flex;
        flex-direction:row;
        height:0;
        overflow:visible;
        z-index:1000;
    }
    .fab{
        position:relative;
        /* Bottom offset follows the bottom‑panel height variable */
        width:calc(2.5vmin + 3vw);
        height:calc(2.5vmin + 2vh);
        right: var(--fab-right, 5vmin);
        bottom:calc(2.5vmin + 2vh + 1vmin);
        background:rgba(255,255,255,0.2);
        color:#fff;
        border:none;
        padding:1vh 1.5vw;
        font-size:2.2vmin;
        border-radius:0.5vmin;
        cursor:pointer;
        box-shadow:0 2px 6px rgba(0,0,0,.3);
        z-index:996;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:0.5vmin;
        transition: none;
    }
    .fab.hidden, .fab.idle{display:none;}
    .fab:focus-visible{outline:0.3vmin dotted #666;}
    /* -------------------------------------------------
       Share button – SVG icon, hidden on any overlay
       ------------------------------------------------- */
    #shareBtn{
        margin-left:calc(100% - var(--fab-right, 5vmin) - 1.5vw - 2.5vmin);
        margin-right:0;
    }
    #shareBtn svg{
        width:2.5vmin;
        height:2.5vmin;
        fill:#fff;
    }
    /* --------------------------------------------------------------
       Visual style – a classic “switch” (checkbox turned into a slider)
       -------------------------------------------------------------- */
    #helpText{
        font-size:calc(1vmax);
    }
    .switch {
        position: relative;
        display: inline-block;
        width: calc(1.6vmax);
        height: calc(.8vmax);
        margin-bottom: calc(-.1vmax);
        margin-right: 1ch;
    }
    .switch input {
        /* Hide native checkbox but keep it focusable */
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
    }
    .slider {
        position: absolute;
        inset: 0;
        background-color: #222;
        border-radius: calc(.8vmax);
        transition: background .25s;
    }
    .slider::before {
        content: "";
        position: absolute;
        height: calc(.6vmax);
        width: calc(.6vmax);
        left: calc(.1vmax);
        top: calc(.1vmax);
        background-color: #777;
        border-radius: 50%;
        transition: transform .25s;
        box-shadow: 0 calc(.03vmax) calc(.03vmax) rgba(0,0,0,.3);
    }
    input:checked + .slider {
        background-color: #ddd;
    }
    input:focus-visible + .slider {
        outline: 0.3vmin dotted #666;
        outline-offset: .1vmin;
    }
    input:checked + .slider::before {
        transform: translatex(calc(.8vmax));
    }

</style>
</head>
<body>

<!-- ==================== TOP PANEL ==================== -->
<div class="vpanel top">
    <div id="topPanel" class="slide-panel" role="dialog" aria-modal="false" aria-label="Top panel">
        <div id="title"></div>
    </div>
    <div id="topIndicator" class="drag-indicator" tabindex="0" aria-label="Open top panel"></div>
</div>

<!-- ==================== CENTRAL CONTENT ==================== -->
<div class="main-display">
    <div id="clock">
        <div class="unit" data-unit="days">
            <div class="digits" id="days"></div>
            <div class="label">days</div>
        </div>
        <div class="unit" data-unit="hours">
            <div class="digits" id="hours"></div>
            <div class="label">hours</div>
        </div>
        <div class="unit" data-unit="minutes">
            <div class="digits" id="minutes"></div>
            <div class="label">minutes</div>
        </div>
        <div class="unit" data-unit="seconds">
            <div class="digits" id="seconds"></div>
            <div class="label">seconds</div>
        </div>
    </div>
</div>

<!-- Single‑digit fullscreen overlay -->
<div id="digitOverlay"><span id="overlay-value"></span></div>

<!-- Whole clock fullscreen overlay -->
<div id="clockOverlay"><div class="flex-content"></div></div>

<!-- QR‑code overlay (opaque) -->
<div id="qrOverlay">
    <div id="qrContainer"></div>
</div>

<div class=fab-panel>
    <!-- Share button -->
    <button id="shareBtn" class="fab" aria-label="Share">?</button>
</div>

<!-- ==================== BOTTOM PANEL ==================== -->
<div class="vpanel bottom">
    <div id="bottomPanel" class="slide-panel" role="dialog" aria-modal="false" aria-label="Bottom panel">
        <div id="sync">
            <div id="syncTitle">manual sync</div>
            <div class="slider-group">
                <label for="adjMin">± minutes</label>
                <button id="adjMinDecBtn" class="step-btn step-dec" aria-label="-Minute">-</button>
                <input type="range" class="step-int" id="adjMin" min="-30" max="30" value="0">
                <button id="adjMinIncBtn" class="step-btn step-inc" aria-label="+Minute">+</button>
                <output id="outMin">0</output>
            </div>
            <div class="slider-group">
                <label for="adjSec">± seconds</label>
                <button id="adjSecDecBtn" class="step-btn step-dec" aria-label="-Second">-</button>
                <input type="range" class="step-int" id="adjSec" min="-60" max="60" value="0">
                <button id="adjSecIncBtn" class="step-btn step-inc" aria-label="+Second">+</button>
                <output id="outSec">0</output>
            </div>
            <div class="slider-group">
                <label for="adjTenth">± tenths (½‑step)</label>
                <button id="adjTenthDecBtn" class="step-btn step-dec" aria-label="-HalfTenth">-</button>
                <!-- Internally we store half‑steps as integers: -9…9 → -4.5…4.5 -->
                <input type="range" class="step-halfint" id="adjTenth" min="-20" max="20" step="1" value="0">
                <button id="adjTenthIncBtn" class="step-btn step-inc" aria-label="+HalfTenth">+</button>
                <output id="outTenth">0</output>
            </div>
        </div>
    </div>
    <div id="bottomIndicator" class="drag-indicator" tabindex="0" aria-label="Open bottom panel"></div>
    <!-- Progress bar -->
    <div class="progress-bar">
        <label for="progressBar">synchronising</label>
        <progress id="progressBar" max="100" value="0"></progress>
    </div>
</div>

<script>
/* ---------- Parameters ---------- */
const defaultTZ = 'Asia/Jerusalem'
const defaultEpoch = 1696649340;
const defaultShowRelativeDate = false;

/* ---------- Utility ---------- */
function pad(num, len = 2) {
    return String(num).padStart(len, '0');
}

/* ---------- Epoch handling & document title ---------- */
function getEpochFromURL(){
    const params = new URLSearchParams(location.search);
    const ep = params.get('epoch');
    return ep ? Number(ep) : defaultEpoch;
}
const baseEpoch = getEpochFromURL();               // immutable base epoch
let countdown = Date.now() - baseEpoch*1000 < 0;   // test if counting down
function getTZFromURL(){
    const params = new URLSearchParams(location.search);
    const tz = params.get('tz');
    return tz ? tz : defaultTZ;
}
const baseTZ = getTZFromURL();               // immutable base time zone
function getShowRelativeDateFromURL(){
    const params = new URLSearchParams(location.search);
    const rd = params.get('relative');
    return (rd !== undefined && rd !== null) ? (rd === '1' || rd.toLowerCase() === 'true' || rd === '' ? true : (rd === '0' || rd.toLowerCase() === 'false' ? false : defaultShowRelativeDate)) : defaultShowRelativeDate 
}
let showRelativeDate = getShowRelativeDateFromURL();
function updateDocumentTitle(){
    const human = new Date(baseEpoch*1000).toLocaleString("en-GB",{
        year:'numeric', month:'short', day:'numeric', weekday:'short',
        hour:'2-digit', minute:'2-digit', second:'2-digit',
	timeZone:baseTZ, timeZoneName:'short'
    });
    document.title = ('Time '+(countdown?'remaining until ':'elapsed since ')+`${human}`).toLowerCase();
    const clockLabels = document.getElementById('clock').querySelectorAll('.label');
    clockLabels.forEach(l => {l.textContent = l.closest('.unit').getAttribute('data-unit');});
    if (showRelativeDate && !countdown) {
        document.title = (document.title.replace(/time elapsed since/i,'Date relative to')).toLowerCase();
        clockLabels.forEach(l => {l.textContent = l.closest('.unit').getAttribute('data-unit').replace(/s$/i, '');}); // adjust clock units
    }
    document.getElementById('title').textContent = document.title;
}
updateDocumentTitle();

/* ---------- State ---------- */
const units = ['days','hours','minutes','seconds'];
const elems = {days:document.getElementById('days'),
               hours:document.getElementById('hours'),
               minutes:document.getElementById('minutes'),
               seconds:document.getElementById('seconds')};

let adj = {minutes:0, seconds:0, tenth:0};   // tenth stored as real value (e.g. 0.5)

/* helpers for adj */
const setAdjFromAdjMS = (adjMS) => {
    adj.minutes = Math.trunc(adjMS / (60 * 1000));
    adj.seconds = Math.trunc((adjMS - adj.minutes * (60 * 1000)) / 1000);
    adj.tenth = Math.round((adjMS - adj.minutes * (60 * 1000) - adj.seconds * 1000) / 100 * 2) / 2; // half-integer accuracy
}
const getAdjMS = () => {
    return (adj.minutes*60 + adj.seconds + adj.tenth/10)*1000;
}

let overlayInfo = null;                    // {unit:string, idx:number}

</script>

<script>
/**************************************
 *** Automatic syncronisation addon ***
 **************************************/

/* ==============================================================
   USER‑CONFIGURABLE PARAMETERS
   ============================================================== */
const TOTAL_ROUNDS          = 31;      // how many HEAD requests per sync
const HTTP_TIMEOUT          = 2000;    // HTTP fetch timeout
const DISCARD_FRACTION      = 0.30;    // discard the worst 30 % RTTs
const RE_SYNC_INTERVAL_MS   = 5 * 60 * 1000; // every 5 min
const SMOOTH_ALPHA          = 0.2;    // exponential smoothing factor
const PROCESS_NOISE_OFFSET  = 0.5;    // tiny process‑noise (ms²) for Kalman offset
const PROCESS_NOISE_DRIFT   = 1e-12;  // tiny process‑noise for drift (ms² per ms²)
const MIN_PAUSE_MS          = 30;     // minimum jitter between requests
const MAX_PAUSE_MS          = 300;    // maximum jitter between requests
/* ============================================================== */

/* -------------------------------------------------------------
   GLOBAL STATE (Kalman filter + network flag)
   ------------------------------------------------------------- */
let kalman = {
  x: [0, 0],               // [offset (ms), drift (ms per ms)]
  P: [[1e6, 0], [0, 1e-6]],
  Q: [[PROCESS_NOISE_OFFSET, 0],
      [0, PROCESS_NOISE_DRIFT]]
};
let networkOk = true;      // becomes false if a whole sync batch fails

/* -------------------------------------------------------------
   Helper: single HEAD measurement → {rtt, offset}
   ------------------------------------------------------------- */
async function measureOnce() {
  const tSend = performance.now();                     // client send (monotonic)

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(),
                               HTTP_TIMEOUT);               // abort after 2 s

  const resp = await fetch(location.href, {
    method: "HEAD",
    cache: "no-store",
    signal: controller.signal
  }).finally(() => clearTimeout(timeoutId));

  const tRecv = performance.now();                     // client receive

  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

  const serverDate = resp.headers.get("date");
  if (!serverDate) throw new Error("No Date header");

  const serverMs = new Date(serverDate).getTime();     // server epoch ms

  // Convert monotonic timestamps to the same epoch as the server:
  const nowEpoch = Date.now();                         // epoch ms now
  const perfNow   = performance.now();                 // monotonic now
  const deltaPerf = tSend - perfNow;                   // negative offset
  const tSendEpoch = nowEpoch + deltaPerf;             // approx epoch of tSend
  const tRecvEpoch = nowEpoch + (tRecv - perfNow);     // approx epoch of tRecv

  const rtt    = tRecv - tSend;                       // ms
  const offset = serverMs - (tSendEpoch + rtt / 2);    // naive offset (ms)

  return {rtt, offset};
}

/* -------------------------------------------------------------
   Kalman update – only the offset part (drift learned in predict)
   ------------------------------------------------------------- */
function kalmanUpdate(measuredOffset, rtt) {
  const R = Math.pow(rtt, 2);          // measurement variance (ms²)
  const y = measuredOffset - kalman.x[0]; // innovation (residual)
  const S = kalman.P[0][0] + R;        // innovation covariance
  const K0 = kalman.P[0][0] / S;       // Kalman gain (scalar)

  // Update state (offset only)
  kalman.x[0] = kalman.x[0] + K0 * y;

  // Update covariance (offset part)
  const P00new = (1 - K0) * kalman.P[0][0];
  kalman.P[0][0] = P00new;
}

/* -------------------------------------------------------------
   Kalman prediction – advances offset by drift * dt
   ------------------------------------------------------------- */
function kalmanPredict(dt) {
  // State transition: offset += drift * dt
  kalman.x[0] = kalman.x[0] + kalman.x[1] * dt;

  // Covariance prediction: P = F P Fᵀ + Q   (F = [[1,dt],[0,1]])
  const F00 = 1, F01 = dt, F10 = 0, F11 = 1;
  const PFt = [
    [F00 * kalman.P[0][0] + F01 * kalman.P[1][0],
     F00 * kalman.P[0][1] + F01 * kalman.P[1][1]],
    [F10 * kalman.P[0][0] + F11 * kalman.P[1][0],
     F10 * kalman.P[0][1] + F11 * kalman.P[1][1]]
  ];
  kalman.P = [
    [PFt[0][0] * F00 + PFt[0][1] * F01 + kalman.Q[0][0],
     PFt[0][0] * F10 + PFt[0][1] * F11 + kalman.Q[0][1]],
    [PFt[1][0] * F00 + PFt[1][1] * F01 + kalman.Q[1][0],
     PFt[1][0] * F10 + PFt[1][1] * F11 + kalman.Q[1][1]]
  ];
}

/* -------------------------------------------------------------
   Robust statistics helpers
   ------------------------------------------------------------- */

/* Weighted median – weights must be positive.
   Returns the median value when each sample is repeated `weight` times.
   Implemented by sorting and walking cumulative weight. */
function weightedMedian(samples, weights) {
  const paired = samples.map((v,i) => ({v, w:weights[i]}));
  paired.sort((a,b)=>a.v-b.v);
  const totalW = weights.reduce((a,b)=>a+b,0);
  let cum = 0;
  for (const p of paired) {
    cum += p.w;
    if (cum >= totalW/2) return p.v;
  }
  return paired[paired.length-1].v; // fallback
}

/* Huber M‑estimator (robust mean). Returns a robust estimate of the
   location (offset) given samples and a scale parameter `k`. */
function huberEstimator(samples, k = 1.5) {
  // Start with the simple median as an initial guess
  let mu = samples.slice().sort((a,b)=>a-b)[Math.floor(samples.length/2)];
  for (let iter = 0; iter < 5; ++iter) {
    let num = 0, den = 0;
    for (const x of samples) {
      const diff = x - mu;
      const w = Math.abs(diff) <= k ? 1 : k / Math.abs(diff);
      num += w * x;
      den += w;
    }
    mu = num / den;
  }
  return mu;
}

/* -------------------------------------------------------------
   Full calibration – many HEAD requests, jittered pauses,
   trimming, weighted median + Huber blending.
   ------------------------------------------------------------- */
async function calibrate(progress_callback = null) {
  const raw = [];                                   // [{rtt, offset}, …]

  for (let i = 0; i < TOTAL_ROUNDS; ++i) {
    if (progress_callback)
      progress_callback(i / TOTAL_ROUNDS * 100);
    try {
      const meas = await measureOnce();
      raw.push(meas);

    } catch (e) {
      console.warn(`Round ${i+1} failed:`, e);
    }

    // ---- JITTERED pause before the next request -----------------
    const pause = MIN_PAUSE_MS + Math.random() * (MAX_PAUSE_MS - MIN_PAUSE_MS);
    await new Promise(res => setTimeout(res, pause));
  }
  if (progress_callback)
    progress_callback(100);

  if (raw.length === 0) throw new Error("All measurements failed");

  // --------------------------------------------------------------
  // 1️⃣ Sort by RTT and discard the worst fraction
  // --------------------------------------------------------------
  raw.sort((a,b)=>a.rtt-b.rtt);
  const keepCount = Math.max(1, Math.floor(raw.length * (1 - DISCARD_FRACTION)));
  const kept = raw.slice(0, keepCount);

  // --------------------------------------------------------------
  // 2️⃣ Prepare arrays for the robust estimators
  // --------------------------------------------------------------
  const offsets = kept.map(m=>m.offset);
  const weights = kept.map(m=>1/m.rtt);   // 1/RTT weighting

  // --------------------------------------------------------------
  // 3️⃣ Weighted median (very robust to outliers)
  // --------------------------------------------------------------
  const wm = weightedMedian(offsets, weights);

  // --------------------------------------------------------------
  // 4️⃣ Huber M‑estimator (robust mean) – also feed Kalman
  // --------------------------------------------------------------
  const huber = huberEstimator(offsets);
  for (const m of kept) kalmanUpdate(m.offset, m.rtt);

  // --------------------------------------------------------------
  // 5️⃣ Blend the two robust results (50 % each)
  // --------------------------------------------------------------
  const blendedOffset = 0.5 * wm + 0.5 * huber;

  // --------------------------------------------------------------
  // 6️⃣ Show a short summary
  // --------------------------------------------------------------
  const avgRtt = kept.reduce((a,c)=>a+c.rtt,0) / kept.length;
  // Debug:
  console.log(`Computed Time Offset ≈ ${Math.round(blendedOffset)} ms, RTT ≈ ${avgRtt.toFixed(1)} ms`);

  return blendedOffset;
}

</script>

<script>

/* ---------- Render clock ---------- */
function renderClock(){
    const adjMS = getAdjMS();
    const now = Date.now();
    const diffMSsigned = now - baseEpoch*1000 + adjMS;
    if (countdown && diffMSsigned >= 0) {
        countdown = diffMSsigned < 0;
        updateDocumentTitle();
    }
    const diffMS = diffMSsigned < 0 ? -diffMSsigned + 1000 : diffMSsigned;
    const days = Math.floor(diffMS / (86400*1000)) + (showRelativeDate && !countdown ? 1 : 0);
    const hours = Math.floor((diffMS % (86400*1000)) / (3600*1000));
    const minutes = Math.floor((diffMS % (3600*1000)) / (60*1000));
    const seconds = Math.floor((diffMS % (60*1000)) / (1000));

    const parts = {
        days:    pad(days, 3),
        hours:   pad(hours, 2),
        minutes: pad(minutes, 2),
        seconds: pad(seconds, 2)
    };

    // Populate the four columns
    units.forEach(u => {
        const str = parts[u];
	if (str.length != elems[u].childElementCount) {
            elems[u].innerHTML = '';
            for (let ch of str) {
                const span = document.createElement('span');
                span.className = 'digit';
                span.setAttribute("tabindex", "0");
                span.addEventListener('keydown', async e => {
                    if (e.key == 'Enter' || e.key == ' ') {
                        e.preventDefault();
                        startDigitOverlay(e);
                    }
                });
                elems[u].appendChild(span);
	    }
	}
        for (let i=0; i<str.length; i++) {
	    const span = elems[u].children[i];
            span.textContent = str[i];
        }
    });

    // If the single‑digit overlay is active, keep it in sync
    if (overlayInfo){
        const curStr = parts[overlayInfo.unit];
        const digit = curStr.charAt(overlayInfo.idx) || '';
        document.getElementById('overlay-value').textContent = digit;
    }
}




/* ---------- fullscreen overlay ---------- */
async function startDigitOverlay(e) {
    if (!e.target.classList.contains('digit')) return;

    const unitEl = e.target.closest('.unit');
    const unit = unitEl.dataset.unit;
    const idx = Array.from(unitEl.querySelector('.digits').children).indexOf(e.target);
    overlayInfo = {unit, idx};

    const overlay = document.getElementById('digitOverlay');
    const shareBtn = document.getElementById('shareBtn');
    shareBtn.classList.add('hidden');

    // Wake‑Lock (if supported)
    let wakeLock = null;
    if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
    }

    // Fullscreen
    if (document.fullscreenEnabled) {
        try { await document.documentElement.requestFullscreen(); } catch (_) {}
    }

    overlay.style.display = 'flex';
    overlay.setAttribute("tabindex", "0");
    overlay.style.outline = 'none';
    overlay.focus();

    const closeFn = async () => {
        overlay.style.display = 'none';
        overlayInfo = null;
        shareBtn.classList.remove('hidden');
        if (wakeLock) { try { await wakeLock.release(); } catch (_) {} }
        if (document.fullscreenElement) {
            try { await document.exitFullscreen(); } catch (_) {}
        }
        overlay.removeEventListener('click', closeFn);
        overlay.removeEventListener('keydown', async e => {e.preventDefault(); closeFn();});
    };
    overlay.addEventListener('click', closeFn);
    overlay.addEventListener('keydown', async e => {e.preventDefault(); closeFn();});
}

document.querySelectorAll('.slider-group').forEach(group => { // connect buttons
    const range = group.querySelector('input[type=range]');
    const output = group.querySelector('output');
    const decBtn = group.querySelector('.step-dec');
    const incBtn = group.querySelector('.step-inc');
    const updateOutput = () => {
        v = Number(range.value);
        if (range.id == 'adjTenth'){
            v = v / 2;
        }
        const classes = range.classList;
        output.textContent = classes.contains('step-int') ? v.toFixed(0) : (classes.contains("step-halfint") ? v.toFixed(1) : v);
        switch (range.id) {
            case 'adjMin': adj.minutes = v; break;
            case 'adjSec': adj.seconds = v; break;
            case 'adjTenth': adj.tenth = v; break;
            default: break;
        };
        const adjMS = getAdjMS();
        const now = Date.now();
        const diffMSsigned = now - baseEpoch*1000 + adjMS;
        countdown = diffMSsigned < 0; // re-test if counting down after adjustments
        updateDocumentTitle();
    };
    range.addEventListener('input', updateOutput);
    range.addEventListener('change', updateOutput);
    const clamp = (v) => Math.min(Math.max(v, Number(range.min)), Number(range.max));
    decBtn.addEventListener('click', () => {
        const s = Number(range.step) || 1;
        range.value = clamp(Number(range.value) - s)
        updateOutput();
    });
    incBtn.addEventListener('click', () => {
        const s = Number(range.step) || 1;
        range.value = clamp(Number(range.value) + s)
        updateOutput();
    });
    // Initialize
    updateOutput();
});
const syncSliders = () => {
    document.querySelectorAll('.slider-group').forEach(group => {
        const range = group.querySelector('input[type=range]');
        const output = group.querySelector('output');
        const classes = range.classList;
        v = 0;
        switch (range.id) {
            case 'adjMin': v = adj.minutes; break;
            case 'adjSec': v = adj.seconds; break;
            case 'adjTenth': v = adj.tenth * 2; break;
            default: break;
        }
        range.value = v.toFixed(0);
        output.textContent = classes.contains('step-int') ? v.toFixed(0) : (classes.contains("step-halfint") ? (v/2).toFixed(1) : v);
    });
}

<script>

/* -------------------------------------------------------------
   Rendering – anchored to the exact UTC second.
   ------------------------------------------------------------- */
function startClock() {
  let lastSec = -1;

  function frame(now) {
    const dt = now - (frame.lastNow ?? now);
    frame.lastNow = now;

    // Advance Kalman (drift correction)
    kalmanPredict(dt);

    // Compute the *corrected* epoch (ms)
    const correctedEpoch = Date.now() + getAdjMS();

    const sec = Math.floor(correctedEpoch / 1000);
    if (sec !== lastSec) {
      lastSec = sec;
      renderClock();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* -------------------------------------------------------------
   Bootstrap – initial sync + periodic re‑sync
   ------------------------------------------------------------- */
(async () => {
  const pb = document.getElementById('progressBar');
  pb.value = 0;
  const progressBarCallback = (v) => {pb.value = v;};
  async function doSync(progress_callback = null) {
    try {
      const newOffset = await calibrate(progress_callback);   // may throw
      // Exponential smoothing – avoid sudden jumps
      if (networkOk) {
        kalman.x[0] = SMOOTH_ALPHA * newOffset + (1 - SMOOTH_ALPHA) * kalman.x[0];
      } else {
        kalman.x[0] = newOffset;            // first successful sync after outage
      }
      networkOk = true;
    } catch (e) {
      console.warn("Calibration failed – falling back to local clock:", e);
      networkOk = false;
    }
    if (networkOk)
      setAdjFromAdjMS(kalman.x[0])            // network‑synced offset;
    const correctedEpoch = Date.now() + getAdjMS();
    const diffMSsigned = correctedEpoch - baseEpoch*1000;
    countdown = diffMSsigned < 0; // re-test if counting down after adjustments
    syncSliders();
    updateDocumentTitle();
  }

  pb.value = 0;
  // First run
  await doSync(progressBarCallback);
  pb.value = 0;

  // Start ticking
  startClock();

  // Re‑sync every RE_SYNC_INTERVAL_MS
  setInterval(() => {pb.value=0; doSync(progressBarCallback); pb.value=0;}, RE_SYNC_INTERVAL_MS);
})();


</script>

<script>



/* ---------- Panel logic ---------- */
(() => {
    /* -------------------------------------------------
       Utility helpers
       ------------------------------------------------- */
    const getY = e => e.clientY;

    /* -------------------------------------------------
       Panel configuration – each panel gets its own state
       ------------------------------------------------- */
    const panels = [
        {
            el:        document.getElementById('topPanel'),
            p:         document.getElementById('topPanel').closest('.vpanel'),
            indicator: document.getElementById('topIndicator'),
            side:      'top',
            openClass: 'open',
            openingClass: 'opening',
            isOpen:    false
        },
        {
            el:        document.getElementById('bottomPanel'),
            p:         document.getElementById('bottomPanel').closest('.vpanel'),
            indicator: document.getElementById('bottomIndicator'),
            side:      'bottom',
            openClass: 'open',
            openingClass: 'opening',
            isOpen:    false
        }
    ];
    const getClosestPanel = (x,y) => {
        const dir = (po) => (po.side == 'top' || po.side == 'bottom') ? 'vertical' : undefined;
        const getDist = (x,y,po) => {
            if (po === undefined || po.p === undefined || dir(po) === undefined)
                return infinity;
            if (dir(po) === 'vertical')
                return (po.p.offsetTop > y) ? po.p.offsetTop - y : ((po.p.offsetTop + po.p.offsetHeight < y) ? y - po.p.offsetTop - po.p.offsetHeight : 0);
            return infinity;
        };
        const d = Array.from(panels).map(po => getDist(x,y,po));
        const m = d.toSorted((a,b) => a-b);
        return panels[d.indexOf(m[0])];
    }

    /* -------------------------------------------------
       CSS‑variable helpers – keep the layout in sync
       ------------------------------------------------- */

    /* -------------------------------------------------
       Open / close logic (shared)
       ------------------------------------------------- */
    const open = panel => {
        panel.p.classList.add(panel.openClass);
        panel.isOpen = true;
    };
    const close = panel => {
        panel.p.classList.remove(panel.openClass);
        panel.isOpen = false;
    };

    /* -------------------------------------------------
       Gesture handling – identical for both panels
       ------------------------------------------------- */
    panels.forEach(panel => {
        let startY = 0, curY = 0, dragging = false;
        /* the following might cause a short flicker, but the panels 
           should be out of view, so we hope for the best... */
        panel.el.classList.add(panel.openingClass);
        const panelHeight = panel.el.scrollHeight;
        panel.el.classList.remove(panel.openingClass);

        const onStart = e => {
            startY = getY(e);
            const touchSide = getClosestPanel(0,startY).side;
            if (panel.side !== touchSide) return;
            dragging = true;
            document.body.style.userSelect = 'none';
        };
        const onMove = e => {
            if (!dragging) return;
            curY = getY(e);
            const delta = curY - startY;               // +down, -up

            const opening = panel.side === 'top' ? delta > 0 : delta < 0;
            if (opening && !panel.isOpen)
                panel.el.classList.add(panel.openingClass);
            const height = panelHeight;
            const pxTranslate = Math.abs(Math.min(0, Math.max(-height, delta*(panel.side==='bottom'?-1:1) - (panel.isOpen?0:height))));

            const pxHeight = height - Math.abs(pxTranslate);
            panel.el.style['margin-'+panel.side] = `-${pxTranslate}px`;
            if (opening)
                panel.p.style['margin-'+(panel.side==='top'?'bottom':'top')] = !panel.isOpen?`-${pxHeight}px`:0;
            else
                panel.p.style['margin-'+(panel.side==='top'?'bottom':'top')] = panel.isOpen?`${pxTranslate}px`:0;
        };
        const onEnd = (e) => {
            panel.el.classList.remove(panel.openingClass);
            if (!dragging) return;
            curY = getY(e);
            dragging = false;
            document.body.style.userSelect = '';

            const delta = curY - startY;
            if (delta === 0) return; // avoid handling taps/clicks
            const thrMin = 50, thrMax = 200, thrR = 0.25;
            thrX = Math.min(Math.max(panelHeight, thrMin), thrMax/thrR);
            const threshold = thrMin + (thrX - thrMin)/(thrMax/thrR - thrMin) * (thrMax - thrMin);
            const shouldOpen = panel.side === 'top' ? 
                (panel.isOpen ? -delta < threshold : delta > threshold) : 
                (panel.isOpen ? -delta > -threshold : delta < -threshold);

            panel.el.style['margin-'+panel.side] = '';
            panel.p.style['margin-'+(panel.side==='top'?'bottom':'top')] = '';

            shouldOpen ? open(panel) : close(panel);
        };

        /* ----- Listener wiring (zone ↔ panel) ----- */
        const attach = target => {
            target.addEventListener('pointerdown', onStart, {passive:true});
            target.addEventListener('pointermove',  onMove,  {passive:true});
            target.addEventListener('pointerup',   onEnd);
            target.addEventListener('pointercancel',onEnd);
        };
        const detach = target => {
            target.removeEventListener('pointerdown', onStart);
            target.removeEventListener('pointermove',  onMove);
            target.removeEventListener('pointerup',   onEnd);
            target.removeEventListener('pointercancel',onEnd);
        };

        // Initially the panels are closed → listen on the invisible zones
        attach(document.querySelector('body'));

        /* ----- Click / keyboard on the thin indicator ----- */
        panel.indicator.addEventListener('click', () => {
            panel.isOpen ? close(panel) : open(panel);
        });
        panel.indicator.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                panel.isOpen ? close(panel) : open(panel);
            }
        });
    });
})();
</script>

<script>
/* ---------- Share button animation ---------- */
(() => {
    // -------------------------------------------------
    // Configuration
    // -------------------------------------------------
    const IDLE_TIMEOUT_MS = 5000;   // time of inactivity before hiding
    const HIDE_DISTANCE   = -120;    // px the button moves right (off‑screen)
    const ANIM_DURATION   = 500;    // ms for slide‑in/out animation

    // -------------------------------------------------
    // State
    // -------------------------------------------------
    const fab = document.querySelector('.fab');
    const defaultFabRight = parseFloat(getComputedStyle(fab).getPropertyValue('right')) || 0;
    let idleTimer = null;
    let animFrame = null;
    let animStart = null;
    let animFrom  = 0;   // current right offset (0 = visible)
    let animTo    = 0;   // target offset (0 or HIDE_DISTANCE)

    // -------------------------------------------------
    // Helper – start the slide animation
    // -------------------------------------------------
    const startAnim = (to) => {
        cancelAnimationFrame(animFrame);
        animFrom = parseFloat(getComputedStyle(fab).getPropertyValue('--fab-right')) || 0;
        // bottomPanel open should prevent hiding
        animTo   = to;
        animStart = null;
        // immediately make the button visible
        if (animTo === 0) fab.classList.remove('idle');

        const step = timestamp => {
            if (!animStart) animStart = timestamp;
            const elapsed = timestamp - animStart;
            const progress = Math.min(elapsed / ANIM_DURATION, 1);
            // Ease‑out cubic for a smooth feel
            const eased = 1 - Math.pow(1 - progress, 3);
            const current = defaultFabRight + animFrom + (animTo - animFrom) * eased;
            fab.style.setProperty('--fab-right', `${current}px`);

            if (progress < 1) {
                animFrame = requestAnimationFrame(step);
            } else {
                // Animation finished – clean up
                animFrame = null;
                if (animTo === 0) fab.classList.remove('idle');
                else fab.classList.add('idle');
            }
        };
        animFrame = requestAnimationFrame(step);
    };

    // -------------------------------------------------
    // Idle handling
    // -------------------------------------------------
    const resetIdleTimer = () => {
        // If we were idle, bring the button back immediately
        if (fab.classList.contains('idle')) startAnim(0);
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => startAnim(HIDE_DISTANCE), IDLE_TIMEOUT_MS);
    };


    // -------------------------------------------------
    // Activity listeners – cover all typical input sources
    // -------------------------------------------------
    const activityEvents = [
        'mousemove','mousedown','mouseup','wheel',
        'touchstart','touchmove','touchend',
        'keydown','keyup','pointermove','scroll'
    ];
    let attached = false;
    const attach = () => {
        activityEvents.forEach(ev => window.addEventListener(ev, resetIdleTimer, {passive:true}));

        // -------------------------------------------------
        // Initialise – start the idle countdown right away
        // -------------------------------------------------
        resetIdleTimer();   // first timeout will hide after IDLE_TIMEOUT_MS
        attached = true;
    }
    attach();
    const detach = () => {
        activityEvents.forEach(ev => window.removeEventListener(ev, resetIdleTimer));
        clearTimeout(idleTimer);
        attached = false;
    }

    // -------------------------------------------------
    // Lower panel open should prevent behaviour
    // -------------------------------------------------
    const bottomPanel = document.getElementById('bottomPanel').closest('.vpanel');
    const observer = new MutationObserver(() => {
        if (bottomPanel.classList.contains('open')) {
            detach(); 
        }
        else {
            if (!attached)
                attach();
        }
    });
    observer.observe(bottomPanel, {attributes:true, attributeFilter:['class']});
})();
</script>
<script>
/***************************************************
 ***** Whole clock fullscreen overlay handling *****
 ***************************************************/
(() => {
    /* -------------------------------------------------
       Configuration
       ------------------------------------------------- */
    const DOUBLE_TAP_MAX_DELAY = 300; // ms between taps
    const CLICKABLE_SELECTOR = [
        'a','button','input','select','textarea',
        '[role="button"]','[onclick]','[data-clickable]'
    ].join(',');

    /* -------------------------------------------------
       State & helpers
       ------------------------------------------------- */
    let lastTap = 0;
    const overlay   = document.getElementById('clockOverlay');
    const flexBox   = document.getElementById('clock');
    const flexParent = flexBox.parentElement;
    const flexWrap  = overlay.querySelector('.flex-content');

    // Detect if the target (or its ancestor) is a clickable element
    const isClickable = (el) => !!el.closest(CLICKABLE_SELECTOR);

    // Move the flex‑box into the overlay (or back to the page)
    const moveFlexIntoOverlay = () => {
        flexWrap.appendChild(flexBox);
        overlay.classList.add('active');
        requestFullscreen();
        requestWakeLock();
    };
    const moveFlexBackToPage = () => {
        const now = Date.now();
        if (now - lastTap < DOUBLE_TAP_MAX_DELAY) return;
        lastTap = 0;
        flexParent.appendChild(flexBox);
        overlay.classList.remove('active');
        releaseWakeLock();
        releaseFullscreen();
    };

    /* -------------------------------------------------
       Double‑tap / double‑click detector
       ------------------------------------------------- */
    const handlePointerDown = (e) => {
        if (isClickable(e.target)) return; // ignore real clickable UI

        const now = Date.now();
        if (now - lastTap < DOUBLE_TAP_MAX_DELAY) {
            // Double‑tap detected
            moveFlexIntoOverlay();
        } else {
            lastTap = overlay.classList.contains('active') ? 0 : now;
        }
    };
    document.addEventListener('pointerdown', handlePointerDown, {passive:true});

    /* -------------------------------------------------
       Close handling (click)
       ------------------------------------------------- */
    overlay.addEventListener('click', moveFlexBackToPage);

    /* -------------------------------------------------
       Screen‑timeout prevention (Wake Lock API)
       ------------------------------------------------- */
    let wakeLock = null;
    const requestWakeLock = async () => {
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (err) {
                // Most browsers just ignore if not permitted – safe to ignore
                console.warn('WakeLock failed:', err);
            }
        }
    };
    const releaseWakeLock = async () => {
        if (wakeLock) {
            try { await wakeLock.release(); } finally { wakeLock = null; }
        }
    };
    const requestFullscreen = async () => {
        if (document.fullscreenEnabled) {
            try { await document.documentElement.requestFullscreen(); } catch (_) {}
        }
    }
    const releaseFullscreen = async () => {
        if (document.fullscreenElement) {
            try { await document.exitFullscreen(); } catch (_) {}
        }
    }
    // Re‑acquire if the page becomes visible again while overlay is open
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' &&
            overlay.classList.contains('active')) {
            requestFullscreen();
            requestWakeLock();
        } else {
            releaseWakeLock();
            releaseFullscreen();
        }
    });
})();
</script>
